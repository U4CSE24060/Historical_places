<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Historical Wonders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h1>🌍 Historical Wonders</h1>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="civilizations.html">Civilizations</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h2>Contact Us</h2>
    <p>We'd love to hear from you! Send us your thoughts, feedback, or inquiries.</p>
  </header>

  <main style="padding: 2rem; max-width: 700px; margin: auto;">
    <form style="display: flex; flex-direction: column; gap: 1rem; background-color: rgba(255,255,255,0.1); padding: 2rem; border-radius: 1rem; box-shadow: 0 0 20px rgba(0,0,0,0.4); animation: fadeInUp 1s ease-in;">
      <label>Name:
        <input type="text" name="name" placeholder="Your Name" required style="width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: none;">
      </label>
      <label>Email:
        <input type="email" name="email" placeholder="you@example.com" required style="width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: none;">
      </label>
      <label>Message:
        <textarea name="message" rows="5" placeholder="Write your message here..." required style="width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: none;"></textarea>
      </label>
      <button type="submit" style="padding: 0.7rem; background-color: gold; color: black; font-weight: bold; border: none; border-radius: 0.5rem; cursor: pointer; transition: background-color 0.3s;">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Historical Wonders | All Rights Reserved</p>
  </footer>
</body>
</html>
